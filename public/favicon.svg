<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Definitions for clip paths and gradients if needed -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Top Leather Strap -->
  <path d="M175 130 L175 58 C175 36 193 18 215 18 L297 18 C319 18 337 36 337 58 L337 130 Z" fill="#543126" />

  <!-- Bottom Leather Strap -->
  <path d="M175 382 L175 454 C175 476 193 494 215 494 L297 494 C319 494 337 476 337 454 L337 382 Z" fill="#543126" />

  <!-- Gold Watch Case Base (with lugs) -->
  <!-- Beautiful tonneau/lug shape flaring out to 4 corners -->
  <path d="
    M 152 86 
    C 176 86, 185 106, 194 122 
    C 213 115, 234 111, 256 111 
    C 278 111, 299 115, 318 122 
    C 327 106, 336 86, 360 86 
    C 378 86, 394 100, 397 118 
    C 402 144, 386 182, 386 200 
    C 402 216, 412 235, 412 256 
    C 412 277, 402 296, 386 312 
    C 386 330, 402 368, 397 394 
    C 394 412, 378 426, 360 426 
    C 336 426, 327 406, 318 390 
    C 299 397, 278 401, 256 401 
    C 234 401, 213 397, 194 390 
    C 185 406, 176 426, 152 426 
    C 134 426, 118 412, 115 394 
    C 110 368, 126 330, 126 312 
    C 110 296, 100 277, 100 256 
    C 100 235, 110 216, 126 200 
    C 126 182, 110 144, 115 118 
    C 118 100, 134 86, 152 86 
    Z" 
    fill="#FFCA28" />

  <!-- Outer Bezel Accent Rim -->
  <circle cx="256" cy="256" r="144" fill="#E59F14" />

  <!-- Main Gold Bezel Face -->
  <circle cx="256" cy="256" r="132" fill="#FFCA28" />

  <!-- Inner Bezel Ring Rim -->
  <circle cx="256" cy="256" r="116" fill="#E59F14" />

  <!-- White Dial Face -->
  <circle cx="256" cy="256" r="110" fill="#FFFFFF" />

  <!-- Hour Markers (12 markers in soft slate-blue pill shapes) -->
  <g fill="#B0BEC5">
    <!-- 12 o'clock -->
    <rect x="247" y="152" width="18" height="22" rx="9" />
    <!-- 1 o'clock (30 deg) -->
    <rect x="247" y="152" width="18" height="22" rx="9" transform="rotate(30 256 256)" />
    <!-- 2 o'clock (60 deg) -->
    <rect x="247" y="152" width="18" height="22" rx="9" transform="rotate(60 256 256)" />
    <!-- 3 o'clock (90 deg) -->
    <rect x="247" y="152" width="18" height="22" rx="9" transform="rotate(90 256 256)" />
    <!-- 4 o'clock (120 deg) -->
    <rect x="247" y="152" width="18" height="22" rx="9" transform="rotate(120 256 256)" />
    <!-- 5 o'clock (150 deg) -->
    <rect x="247" y="152" width="18" height="22" rx="9" transform="rotate(150 256 256)" />
    <!-- 6 o'clock (180 deg) -->
    <rect x="247" y="152" width="18" height="22" rx="9" transform="rotate(180 256 256)" />
    <!-- 7 o'clock (210 deg) -->
    <rect x="247" y="152" width="18" height="22" rx="9" transform="rotate(210 256 256)" />
    <!-- 8 o'clock (240 deg) -->
    <rect x="247" y="152" width="18" height="22" rx="9" transform="rotate(240 256 256)" />
    <!-- 9 o'clock (270 deg) -->
    <rect x="247" y="152" width="18" height="22" rx="9" transform="rotate(270 256 256)" />
    <!-- 10 o'clock (300 deg) -->
    <rect x="247" y="152" width="18" height="22" rx="9" transform="rotate(300 256 256)" />
    <!-- 11 o'clock (330 deg) -->
    <rect x="247" y="152" width="18" height="22" rx="9" transform="rotate(330 256 256)" />
  </g>

  <!-- Watch Hands in Dark Brown (#543126) -->
  <g stroke="#543126" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Connected Hand at ~1:04 (Pivot at 264, 268; bent elbow to 284, 192) -->
    <polyline points="278,272 264,260 286,192" />
  </g>
</svg>